<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gujarati Calendar SA · 2026 to 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6EFDF; --bg2:#FBF7EC; --card:#FFFDF8; --ink:#1B2150; --muted:#6B6F8E; --line:#E6DAC0;
  --indigo:#1C2878; --indigo2:#2C3CA8; --indigo-d:#141C58;
  --saffron:#E8730C; --saffron-d:#C95F04; --saffron-s:#FDE7CF; --gold:#C79A2B;
  --red:#C0392B; --green:#2E7D5B; --shadow:0 6px 22px rgba(28,40,120,.10);
  --sud:#E8730C; --pk:#4A4F63;
  --font:"Poppins","Noto Sans Gujarati","Nirmala UI","Shruti",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fontg:"Noto Sans Gujarati","Nirmala UI","Shruti","Poppins",system-ui,sans-serif;
}
[data-theme="dark"]{
  --bg:#0E1230; --bg2:#121843; --card:#171E52; --ink:#F1ECDD; --muted:#A5A9CF; --line:#2B3470;
  --indigo:#0A0E2B; --indigo2:#2C3CA8; --indigo-d:#070A20; --saffron:#FF9A3D; --saffron-d:#FFB066; --saffron-s:#3A2A18;
  --red:#FF7A68; --green:#5FD0A0; --shadow:0 6px 22px rgba(0,0,0,.35); --pk:#2A3068;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--ink);min-height:100vh;
  background-image:radial-gradient(circle at 12% 8%,rgba(232,115,12,.07),transparent 40%),radial-gradient(circle at 90% 92%,rgba(28,40,120,.07),transparent 42%);
  -webkit-font-smoothing:antialiased}
body.gu{font-family:var(--fontg)}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.gu-font{font-family:var(--fontg)}

/* header */
.top{background:linear-gradient(120deg,var(--indigo-d),var(--indigo) 55%,var(--indigo2));color:#fff;position:relative;overflow:hidden}
.top::before{content:"";position:absolute;inset:0;opacity:.18;
  background:
   radial-gradient(circle at 20px 20px,#F5C26B 1.6px,transparent 2px) 0 0/40px 40px,
   radial-gradient(circle at 0 0,#F5C26B 1px,transparent 1.6px) 0 0/40px 40px;}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,var(--saffron),var(--gold),var(--saffron))}
.top-in{max-width:1280px;margin:0 auto;padding:18px 22px 22px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:14px}
.om{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:34px;line-height:1;color:#FFE2B0;
  background:radial-gradient(circle at 30% 30%,#F08A24,#B24E00);box-shadow:0 0 0 3px rgba(255,226,176,.35),0 6px 16px rgba(0,0,0,.3);font-family:"Noto Sans Devanagari","Nirmala UI",serif}
.brand h1{font-size:22px;font-weight:700;letter-spacing:.2px;line-height:1.2}
.brand p{font-size:13px;opacity:.82;margin-top:3px}
.ctrls{display:flex;gap:10px;align-items:center}
.seg{display:inline-flex;background:rgba(255,255,255,.14);border-radius:999px;padding:3px;backdrop-filter:blur(4px)}
.seg button{padding:8px 18px;border-radius:999px;font-weight:600;font-size:14px;color:#fff;opacity:.85;transition:.2s}
.seg button.on{background:#fff;color:var(--indigo);opacity:1;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.iconbtn{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:18px;display:grid;place-items:center;transition:.2s}
.iconbtn:hover{background:rgba(255,255,255,.28)}

.tabs{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(28,40,120,.06)}
.tabs-in{max-width:1280px;margin:0 auto;padding:0 14px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{padding:14px 16px;font-weight:600;font-size:14.5px;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;transition:.15s}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--saffron);border-color:var(--saffron)}

main{max-width:1280px;margin:0 auto;padding:22px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}

/* month hero */
.mhead{background:var(--indigo);border-radius:20px 20px 0 0;padding:14px;display:grid;grid-template-columns:minmax(220px,1fr) 1.5fr minmax(220px,1fr);gap:12px;align-items:center;position:relative;overflow:hidden}
[data-theme="dark"] .mhead{background:#0A0E2B}
.pill{border-radius:10px;padding:10px 16px;text-align:center;font-weight:700}
.pill.or{background:linear-gradient(180deg,#F0852A,#D96508);color:#fff;font-size:20px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.pill.wh{background:#fff;color:var(--indigo);font-size:15px;font-weight:600;font-family:var(--fontg);line-height:1.4}
.mhead .pill.or.en{font-size:22px;letter-spacing:.3px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
.btn{padding:9px 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:600;font-size:14px;color:var(--ink);transition:.15s}
.btn:hover{border-color:var(--saffron);color:var(--saffron)}
.btn.pri{background:var(--saffron);border-color:var(--saffron);color:#fff}
.btn.pri:hover{background:var(--saffron-d);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
select.btn{padding-right:30px}
.sp{flex:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:10px 14px;border-top:1px solid var(--line);align-items:center}
.legend i{font-style:normal}
.lg-sud{font-weight:800;font-size:16px;color:transparent;-webkit-text-stroke:1.2px var(--sud)}
.lg-vad{font-weight:800;font-size:16px;color:var(--sud)}
.lg-pk{background:var(--pk);color:#fff;padding:1px 8px;border-radius:5px;font-size:11px}
.lg-ph{color:var(--red);font-weight:700}

.gridwrap{padding:12px;background:var(--indigo);border-radius:0 0 20px 20px}
[data-theme="dark"] .gridwrap{background:#0A0E2B}
.wdrow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wdrow{margin-bottom:8px}
.wd{background:#fff;border-radius:9px;text-align:center;padding:5px 2px;line-height:1.25}
[data-theme="dark"] .wd{background:#1E2766}
.wd b{display:block;font-size:11px;letter-spacing:.5px;color:var(--indigo)}
[data-theme="dark"] .wd b{color:#fff}
.wd span{display:block;font-size:14px;font-weight:700;color:var(--saffron);font-family:var(--fontg)}
.cell{background:#fff;border-radius:12px;min-height:128px;padding:7px 8px 6px;position:relative;display:flex;flex-direction:column;cursor:pointer;
  transition:transform .12s,box-shadow .12s;text-align:left;overflow:hidden;color:#1d2340}
[data-theme="dark"] .cell{background:var(--card);color:var(--ink)}
.cell:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.28);z-index:2}
.cell.empty{background:rgba(255,255,255,.55);cursor:default;min-height:80px}
[data-theme="dark"] .cell.empty{background:rgba(255,255,255,.05)}
.cell.empty:hover{transform:none;box-shadow:none}
.cell.today{outline:3px solid var(--gold);outline-offset:-1px}
.c-top{display:flex;align-items:flex-start;gap:6px;border-bottom:1px solid #2a2f55;padding-bottom:3px;min-height:30px}
[data-theme="dark"] .c-top{border-color:var(--line)}
.dn{font-size:26px;font-weight:800;line-height:1;font-family:"Poppins",sans-serif;letter-spacing:-.5px}
.cell.sun .dn{color:var(--indigo2)}
[data-theme="dark"] .cell.sun .dn{color:#9DB0FF}
.cell.ph .dn{color:var(--red)}
.phl{font-size:9.5px;font-weight:700;color:var(--saffron-d);line-height:1.15;margin-left:auto;text-align:right;max-width:64%}
.cell.ph .phl{color:var(--red)}
.dots{margin-left:auto;display:flex;gap:2px;font-size:11px}
.c-body{flex:1;padding-top:4px;display:flex;flex-direction:column;gap:2px;padding-bottom:4px}
.tl{display:flex;align-items:baseline;gap:5px}
.tnum{font-size:25px;font-weight:800;line-height:1.1;font-family:var(--fontg)}
.tithi.sud .tnum{color:transparent;-webkit-text-stroke:1.5px var(--sud);paint-order:stroke}
.tithi.vad .tnum{color:var(--sud)}
.tithi.none .tnum{display:none}
.cell.sun .tithi .tnum{-webkit-text-stroke-color:var(--indigo2)}
.cell.sun .tithi.vad .tnum{color:var(--indigo2)}
[data-theme="dark"] .cell.sun .tithi .tnum{-webkit-text-stroke-color:#9DB0FF}
[data-theme="dark"] .cell.sun .tithi.vad .tnum{color:#9DB0FF}
.pk-lbl{font-size:10.5px;font-weight:700;color:var(--muted)}
.fest{font-size:11px;line-height:1.3;font-weight:500;font-family:var(--fontg)}
.fest .ic{margin-right:2px}
.fest.ek{color:#2E7D5B}
.fest.big{font-weight:700;color:var(--saffron-d)}
.mbar{margin:auto -8px 0;background:linear-gradient(180deg,#F0852A,#D96508);color:#fff;text-align:center;font-weight:700;font-size:12px;padding:3px 4px;font-family:var(--fontg)}
.pkbar{margin:auto -8px -6px;background:var(--pk);color:#fff;text-align:center;font-weight:600;font-size:10.5px;padding:3px 2px;font-family:var(--fontg)}
.mbar+.pkbar{margin-top:0}
.pkbar+.mbar{margin-top:0}
.cell .c-body+.mbar,.cell .c-body+.pkbar{margin-top:auto}
.wdshort{display:none}
.note-dot{position:absolute;right:6px;bottom:30px;font-size:11px}

/* list layout (also used on mobile) */
.grid.list{display:block}
.grid.list .cell{display:grid;grid-template-columns:78px 1fr;column-gap:12px;align-content:start;min-height:0;margin-bottom:8px;padding:10px 12px}
.grid.list .cell.empty{display:none}
.grid.list .c-top{grid-row:1 / span 4;grid-column:1;flex-direction:column;border:none;align-items:center;justify-content:flex-start;gap:2px;padding:0 12px 0 0;border-right:1px solid #d8d2c0;display:flex}
.grid.list .dn{font-size:30px}
.grid.list .wdshort{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase}
.grid.list .phl{margin:4px 0 0;text-align:center;max-width:none}
.grid.list .c-body{grid-column:2;padding-top:0;justify-content:center}
.grid.list .mbar,.grid.list .pkbar{grid-column:2;margin:4px 0 0;border-radius:6px;width:fit-content;padding:3px 12px}
.grid.list .note-dot{bottom:auto;top:8px}
.wdrow.hide{display:none}

/* year */
.yg{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.mini{padding:14px;cursor:default}
.mini h3{font-size:15px;font-weight:700;color:var(--indigo2);display:block;margin-bottom:8px;cursor:pointer;line-height:1.3}
[data-theme="dark"] .mini h3{color:#9DB0FF}
.mini h3 small{display:block;font-size:11.5px;color:var(--saffron);font-weight:600;font-family:var(--fontg)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.mg .h{font-size:10px;font-weight:700;color:var(--muted);padding-bottom:2px}
.md{font-size:12px;padding:5px 0;border-radius:8px;position:relative;cursor:pointer;font-weight:500}
.md:hover{background:var(--saffron-s)}
.md.sun{color:var(--indigo2);font-weight:700}
[data-theme="dark"] .md.sun{color:#9DB0FF}
.md.ph{color:var(--red);font-weight:700}
.md.f1{background:var(--saffron-s);font-weight:700}
.md.f2{background:var(--saffron);color:#fff;font-weight:700}
.md.pur::after,.md.am::after{content:"";position:absolute;bottom:1px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%}
.md.pur::after{background:var(--gold)}
.md.am::after{background:var(--indigo2)}
.md.td{outline:2px solid var(--gold)}
.ykey{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;font-size:13px;color:var(--muted);align-items:center}
.ykey span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}

/* lists */
.fl-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.search{flex:1;min-width:200px;padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:inherit;color:var(--ink)}
.search:focus{outline:2px solid var(--saffron);border-color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{padding:7px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted);transition:.15s}
.chip:hover{border-color:var(--saffron)}
.chip.on{background:var(--saffron);border-color:var(--saffron);color:#fff}
.mgroup{margin-bottom:22px}
.mgroup>h3{font-size:16px;font-weight:700;color:var(--indigo2);padding:6px 4px;margin-bottom:8px;border-bottom:2px solid var(--saffron-s);display:flex;justify-content:space-between}
[data-theme="dark"] .mgroup>h3{color:#9DB0FF}
.row{display:flex;gap:14px;align-items:center;padding:11px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;transition:.12s}
.row:hover{border-color:var(--saffron);transform:translateX(3px)}
.row.past{opacity:.5}
.row.next{border-color:var(--saffron);box-shadow:0 0 0 3px var(--saffron-s)}
.dbadge{min-width:58px;text-align:center;border-radius:12px;background:var(--indigo);color:#fff;padding:6px 4px;line-height:1.1}
.dbadge b{font-size:22px;display:block;font-family:"Poppins",sans-serif}
.dbadge span{font-size:10.5px;opacity:.85;text-transform:uppercase;letter-spacing:.5px}
.row.sunr .dbadge{background:var(--indigo2)}
.rt{flex:1;min-width:0}
.rt b{display:block;font-size:15px;font-weight:600;font-family:var(--fontg)}
.rt small{color:var(--muted);font-size:12.5px;font-family:var(--fontg);display:block;margin-top:2px}
.tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--saffron-s);color:var(--saffron-d);white-space:nowrap}
.tag.ek{background:#DDF3E8;color:#1F6B49}
.tag.ph{background:#FBE0DC;color:var(--red)}
.tag.moon{background:#FFF1C9;color:#8A6A00}
.tag.panchak{background:#E4E5EC;color:#3F4460}
.tag.chauth,.tag.shiv{background:#F1E1FA;color:#7A2F98}
[data-theme="dark"] .tag{background:#2c3270;color:#FFC98F}
.empty-msg{text-align:center;padding:40px;color:var(--muted)}

/* moon sign */
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.rcard{overflow:hidden}
.rcard h3{background:var(--indigo);color:#fff;padding:10px 14px;font-size:15px;font-weight:700}
.rcard table{width:100%;border-collapse:collapse;font-size:13.5px}
.rcard td{padding:7px 12px;border-bottom:1px solid var(--line)}
.rcard tr:last-child td{border:none}
.rcard td:first-child{font-weight:600;font-family:var(--fontg)}
.rcard td:last-child{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rcard tr.cur td{background:var(--saffron-s)}
.rz{font-size:16px;margin-right:6px;color:var(--saffron)}
.letters{margin-top:22px;padding:18px}
.letters h3{margin-bottom:12px;font-size:17px}
.lg{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.lt{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg2)}
.lt b{display:block;font-family:var(--fontg);font-size:15px}
.lt span{font-size:12.5px;color:var(--muted)}
.lt .let{display:block;margin-top:4px;color:var(--saffron-d);font-weight:700;font-family:var(--fontg)}

/* choghadiya */
.cg{display:grid;grid-template-columns:1fr;gap:18px}
.ctab{overflow:auto;padding:0}
.ctab h3{padding:12px 16px;font-size:16px;color:#fff;background:var(--indigo)}
.ctab.night h3{background:#22174F}
.ctab table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
.ctab th{padding:8px 4px;background:var(--bg2);border-bottom:1px solid var(--line);font-size:12px}
.ctab th small{display:block;font-weight:500;color:var(--muted);font-size:10.5px}
.ctab th.tdy{background:var(--saffron-s)}
.ctab td{padding:7px 4px;text-align:center;border-bottom:1px solid var(--line);border-left:1px solid var(--line);line-height:1.25}
.ctab td:first-child{border-left:none;font-size:11px;color:var(--muted);white-space:nowrap;background:var(--bg2);font-variant-numeric:tabular-nums}
.ctab td b{display:block;font-family:var(--fontg);font-size:14px}
.ctab td span{font-size:10.5px;opacity:.85}
.q-good{background:#E4F5EC;color:#1D6A47}
.q-mid{background:#FFF4D6;color:#7A5A00}
.q-bad{background:#FBE5E1;color:#A5331F}
[data-theme="dark"] .q-good{background:#143B2B;color:#8DE5BC}
[data-theme="dark"] .q-mid{background:#3D3414;color:#FFE08A}
[data-theme="dark"] .q-bad{background:#4A1E1A;color:#FFAFA3}
td.nowc{outline:3px solid var(--saffron);outline-offset:-3px;font-weight:800}
.nowbox{padding:16px 20px;margin-bottom:18px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.nowbox .big{font-size:26px;font-weight:800;font-family:var(--fontg)}
.note-s{font-size:13px;color:var(--muted);margin:10px 4px 0;line-height:1.6}

/* guide */
.gd{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.gcard{padding:18px 20px}
.gcard h3{font-size:16px;margin-bottom:8px;color:var(--indigo2);display:flex;gap:8px;align-items:center}
[data-theme="dark"] .gcard h3{color:#9DB0FF}
.gcard p,.gcard li{font-size:13.5px;line-height:1.65;color:var(--ink)}
.gcard ul{padding-left:18px}
.gcard li b{color:var(--saffron-d)}
.sectitle{font-size:20px;font-weight:700;margin:26px 4px 12px;font-family:"Playfair Display",var(--fontg),serif}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,14,43,.55);backdrop-filter:blur(3px);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.sheet{background:var(--card);border-radius:22px;max-width:760px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.sh-top{background:linear-gradient(120deg,var(--indigo-d),var(--indigo2));color:#fff;padding:20px 24px;display:flex;gap:18px;align-items:center;position:sticky;top:0;z-index:2}
.sh-d{font-size:52px;font-weight:800;line-height:1;font-family:"Poppins",sans-serif}
.sh-t{flex:1}
.sh-t b{font-size:18px;display:block}
.sh-t span{font-size:13px;opacity:.85}
.sh-nav{display:flex;gap:6px}
.sh-nav button{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:18px}
.sh-nav button:hover{background:rgba(255,255,255,.3)}
.sh-nav button:disabled{opacity:.3}
.sh-b{padding:20px 24px 26px;display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 14px;font-size:14px;align-items:start}
.kv>div:nth-child(odd){color:var(--muted);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;padding-top:2px}
.kv .g{font-family:var(--fontg)}
.bigt{font-size:26px;font-weight:800;color:var(--saffron);font-family:var(--fontg)}
.mini-cg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mini-cg div{border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;line-height:1.3}
.mini-cg div b{display:block;font-size:13px;font-family:var(--fontg)}
.mini-cg h4{grid-column:1/-1;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}

  .kv{grid-template-columns:1fr}
  .mini-cg{grid-template-columns:repeat(2,1fr)}

  .top,.tabs,.toolbar,.legend,footer,.modal,.note-dot{display:none!important}

  .cell{box-shadow:none;border:1px solid #bbb}
}

const DAYS=[],BYKEY={};
(function(){
  let curP=null,curM=null;
  MONTHS.forEach((M,mi)=>{
    const n=new Date(Date.UTC(M.y,M.m,0)).getUTCDate();
    for(let d=1;d<=n;d++){
      const e=M.d[d]||{}; if(e.p)curP=e.p; if(e.m)curM=e.m;
      const key=`${M.y}-${pad(M.m)}-${pad(d)}`;
      const r={key,y:M.y,m:M.m,d,mi,wd:new Date(Date.UTC(M.y,M.m-1,d)).getUTCDay(),e,paksha:e.t?curP:null,gm:e.t?curM:null,ts:Date.UTC(M.y,M.m-1,d)};
      DAYS.push(r);BYKEY[key]=r;
    }
  });
})();
function dayItems(r){
  const e=r.e,out=[];
  (e.f||[]).forEach(f=>{const o=typeof f==='string'?F[f]:f;out.push({cat:o.type,ic:o.ic,gu:o.gu,en:o.en})});
  if(e.ph){const o=PH[e.ph];out.push({cat:'ph',ic:'🇿🇦',gu:o.gu,en:o.en})}
  if(e.n)out.push({cat:'other',ic:'🪔',gu:e.n.gu,en:e.n.en});
  return out;
}
const PANCHAK=[];
(function(){
  let open=null;
  const FIX={'2027-05-27':{key:'2027-06-01',t:'09:20',derived:true}};
  DAYS.forEach(r=>{
    const p=r.e.pk; if(!p)return;
    if(p[0]==='s'){ if(open)PANCHAK.push(open); open={start:r,t:p.slice(1),end:null,et:null}; if(FIX[r.key]){open.end=BYKEY[FIX[r.key].key];open.et=FIX[r.key].t;open.derived=true;PANCHAK.push(open);open=null} }
    else if(p[0]==='e'&&open){open.end=r;open.et=p.slice(1);PANCHAK.push(open);open=null}
  });
  if(open)PANCHAK.push(open);
})();
function moonInfo(r){
  const s=r.ts,e=s+864e5;let cur=null;const ch=[];
  for(const x of RASI_ALL){if(x.ts<=s)cur=x;else if(x.ts<e)ch.push(x);else break}
  return {cur,ch};
}

function cellHTML(r){
  const e=r.e,tk=todayKey();
  const cls=['cell',r.wd===0?'sun':'',e.ph?'ph':'',r.key===tk?'today':''].join(' ');
  let h=`<div class="${cls}" data-a="day" data-k="${r.key}"><div class="c-top"><span class="dn">${r.d}</span><span class="wdshort">${wdName(r.wd)}</span>`;
  if(e.ph)h+=`<span class="phl">${L(PH[e.ph])}</span>`;
  h+=`</div><div class="c-body">`;
  if(e.t){
    h+=`<div class="tl tithi ${r.paksha==='S'?'sud':'vad'}"><span class="tnum">${tn(e.t)}</span>${e.p?`<span class="pk-lbl">${e.p==='S'?tx('sud'):tx('vad')}</span>`:''}</div>`;
  }
  (e.f||[]).forEach(f=>{const o=typeof f==='string'?F[f]:f;
    const c=o.type==='ek'?'ek':(o.type==='fest'?'big':'');
    h+=`<div class="fest ${c}">${o.ic&&o.type==='fest'?`<span class="ic">${o.ic}</span>`:''}${esc(L(o))}</div>`});
  if(e.n)h+=`<div class="fest">${esc(L(e.n))}</div>`;
  h+=`</div>`;
  if(NOTES[r.key])h+=`<span class="note-dot">📝</span>`;
  if(e.m)h+=`<div class="mbar">${esc(L(GM[e.m]))}</div>`;
  if(e.pk){const p=e.pk;h+=`<div class="pkbar">${p[0]==='s'?tx('pks')+' '+p.slice(1):p[0]==='e'?tx('pke')+' '+p.slice(1):tx('pk')}</div>`}
  return h+`</div>`;
}

/* ---------- Year view ---------- */
function vYear(){
  const tk=todayKey();
  const minis=MONTHS.map((M,mi)=>{
    const first=new Date(Date.UTC(M.y,M.m-1,1)).getUTCDay(),n=new Date(Date.UTC(M.y,M.m,0)).getUTCDate();
    let g=(st.lang==='gu'?['ર','સો','મં','બુ','ગુ','શુ','શ']:['S','M','T','W','T','F','S']).map(x=>`<div class="h">${x}</div>`).join('');
    for(let i=0;i<first;i++)g+='<div></div>';
    for(let d=1;d<=n;d++){
      const r=BYKEY[`${M.y}-${pad(M.m)}-${pad(d)}`],it=dayItems(r);
      const c=['md',r.wd===0?'sun':'',r.e.ph?'ph':''];
      if(it.some(x=>x.cat==='fest'))c.push('f2');else if(it.some(x=>['ek','chauth','shiv'].includes(x.cat)))c.push('f1');
      if((r.e.f||[]).some(f=>f==='purnima'||f==='vratpurnima'))c.push('pur');
      if((r.e.f||[]).includes('amas'))c.push('am');
      if(r.key===tk)c.push('td');
      g+=`<div class="${c.join(' ')}" data-a="day" data-k="${r.key}" title="${esc(it.map(x=>L(x)).join(' · '))}">${d}</div>`;
    }
    return `<div class="card mini"><h3 data-a="openm" data-i="${mi}"><span>${monName(M.m-1)} ${M.y}</span><small>${esc(L(M.head))}</small></h3><div class="mg">${g}</div></div>`;
  }).join('');
  return `<div class="vtitle">${tx('year')}<small>${st.lang==='gu'?'કોઈ પણ મહિનાના નામ પર ક્લિક કરો અથવા તારીખ ઉપર ક્લિક કરો':'Click a month name to open it, or any date for its details'}</small></div>
  <div class="ykey"><span><i class="sw" style="background:var(--saffron)"></i>${tx('f_fest')}</span><span><i class="sw" style="background:var(--saffron-s)"></i>${tx('f_ek')} / ${tx('f_chauth')} / ${tx('f_shiv')}</span>
  <span><i class="sw" style="background:var(--gold);border-radius:50%"></i>${st.lang==='gu'?'પુનમ':'Purnima'}</span><span><i class="sw" style="background:var(--indigo2);border-radius:50%"></i>${st.lang==='gu'?'અમાસ':'Amas'}</span></div>
  <div class="yg">${minis}</div>`;
}

/* ---------- Festivals ---------- */
const FILTERS=['all','fest','ek','chauth','moon','shiv','ph','panchak'];
function allEvents(){
  const out=[];
  DAYS.forEach(r=>dayItems(r).forEach(it=>out.push({r,cat:it.cat==='other'?'fest':it.cat,tag:it.cat,ic:it.ic,gu:it.gu,en:it.en})));
  PANCHAK.forEach(p=>{
    const s=p.start,e=p.end;
    const en=`Panchak · ${dShort2(s,'en')} ${p.t}`+(e?` to ${dShort2(e,'en')} ${p.et}${p.derived?' *':''}`:'');
    const gu=`પંચક · ${dShort2(s,'gu')} ${p.t}`+(e?` થી ${dShort2(e,'gu')} ${p.et}${p.derived?' *':''}`:'');
    out.push({r:s,cat:'panchak',tag:'panchak',ic:'🕉️',gu,en});
  });
  out.sort((a,b)=>a.r.ts-b.r.ts);return out;
}
const dShort2=(r,l)=>`${r.d} ${(l==='gu'?MS_GU:MS_EN)[r.m-1]}`;
function filtered(){
  const q=st.q.trim().toLowerCase(),tk=todayKey(),tr=BYKEY[tk];
  let ev=allEvents();
  if(st.filter!=='all'){ev=ev.filter(x=>st.filter==='fest'?(x.cat==='fest'):x.cat===st.filter)}
  if(q)ev=ev.filter(x=>(x.gu+' '+x.en+' '+x.r.d+' '+MN_EN[x.r.m-1]+' '+MN_GU[x.r.m-1]+' '+WD_EN[x.r.wd]+' '+WD_GU[x.r.wd]).toLowerCase().includes(q));
  const nowTs=(()=>{const n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())})();
  if(st.hidePast)ev=ev.filter(x=>x.r.ts>=nowTs);
  return {ev,nowTs};
}
function listHTML(){
  const {ev,nowTs}=filtered();
  if(!ev.length)return `<div class="empty-msg">${tx('noItems')}</div>`;
  let nextDone=false,html='',curM=-1;
  ev.forEach(x=>{
    if(x.r.mi!==curM){ if(curM!==-1)html+='</div>'; curM=x.r.mi; const M=MONTHS[curM]; html+=`<div class="mgroup"><h3><span>${monName(M.m-1)} ${M.y}</span><span style="font-weight:500;font-size:13px;color:var(--saffron)">${esc(L(M.head))}</span></h3>`}
    const past=x.r.ts<nowTs; let nx='';
    if(!past&&!nextDone){nx='next';nextDone=true}
    const gm=x.r.gm&&x.r.e.t?`${esc(L(GM[x.r.gm]))} ${x.r.paksha==='S'?tx('sud'):tx('vad')} ${tn(x.r.e.t)}`:'';
    const sub=`${wdName(x.r.wd)}${gm?' · '+gm:''}`;
    const tagCls=x.cat==='fest'?'':x.cat;
    html+=`<div class="row ${past?'past':''} ${nx} ${x.r.wd===0?'sunr':''}" data-a="day" data-k="${x.r.key}"><div class="dbadge"><b>${x.r.d}</b><span>${monShort(x.r.m-1)}</span></div>
      <div class="rt"><b>${x.ic?x.ic+' ':''}${esc(L(x))}</b><small>${sub}</small></div><span class="tag ${tagCls}">${tx('cat_'+(x.tag==='other'?'other':x.cat))}</span></div>`;
  });
  return html+'</div>'+(ev.some(x=>x.cat==='panchak'&&/\*/.test(x.en))?`<p class="note-s">* ${st.lang==='gu'?'આ સમય છાપેલા કેલેન્ડરમાં નથી, ચંદ્ર રાશિ કોષ્ટક પરથી લીધો છે.':'This end time is not printed in the calendar. It is taken from the Moon sign table.'}</p>`:'');
}
function vFest(){
  const chips=FILTERS.map(f=>`<button class="chip ${st.filter===f?'on':''}" data-a="filter" data-f="${f}">${tx('f_'+f)}</button>`).join('');
  return `<div class="vtitle">${tx('fest')}<small>${st.lang==='gu'?'આગામી તહેવાર ઘાટા કિનારાથી દેખાય છે':'The next upcoming item is outlined in saffron'}</small></div>
  <div class="fl-bar"><input class="search" id="q" type="search" placeholder="${esc(tx('search'))}" value="${esc(st.q)}"><label class="chip" style="display:inline-flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="hp" ${st.hidePast?'checked':''}> ${tx('hidePast')}</label></div>
  <div class="chips">${chips}</div><div id="flist">${listHTML()}</div>`;
}
function bindFest(){
  const q=$('#q'),hp=$('#hp');
  q.addEventListener('input',()=>{st.q=q.value;$('#flist').innerHTML=listHTML()});
  hp.addEventListener('change',()=>{st.hidePast=hp.checked;$('#flist').innerHTML=listHTML()});
}

/* ---------- Moon sign ---------- */
function vMoon(){
  const nowTs=Date.now(),curNow=[...RASI_ALL].filter(x=>x.ts<=nowTs).pop();
  const cards=MONTHS.map(M=>{
    const key=`${M.y}-${pad(M.m)}`,rows=(RASI_BY_MONTH[key]||[]).map(x=>{
      const R=RASI[x.k];
      return `<tr class="${curNow===x?'cur':''}"><td><span class="rz">${R.z}</span>${st.lang==='gu'?R.gu:R.en+' ('+R.w+')'}</td><td>${pad(x.d)}-${pad(x.m)}-${x.y} &nbsp; ${x.time}</td></tr>`}).join('');
    return `<div class="card rcard"><h3>${monName(M.m-1).toUpperCase()} ${M.y}</h3><table>${rows}</table></div>`;
  }).join('');
  const letters=Object.values(RASI).map(R=>`<div class="lt"><b>${R.z} ${R.gu}</b><span>${R.en} · ${R.w}</span><span class="let">${st.lang==='gu'?R.l[0]:R.l[1]}</span></div>`).join('');
  return `<div class="vtitle">${tx('moon')}<small>${tx('rasiNote')}</small></div><div class="rg">${cards}</div>
  <div class="card letters"><h3>${tx('letters')}</h3><div class="lg">${letters}</div></div>`;
}

/* ---------- Choghadiya ---------- */
function nowChoghadiya(){
  const n=new Date(),mins=n.getHours()*60+n.getMinutes();let night,wd=n.getDay(),i;
  if(mins>=360&&mins<1080){night=false;i=Math.floor((mins-360)/90)}
  else{night=true;const m2=mins>=1080?mins-1080:mins+360;i=Math.floor(m2/90);if(mins<360)wd=(wd+6)%7}
  return {night,wd,i};
}
function cgTable(night,nowc){
  const tdy=new Date().getDay();
  let h=`<div class="card ctab ${night?'night':''}"><h3>${night?'🌙 ':'☀️ '}${tx(night?'nightT':'dayT')}</h3><table><tr><th></th>${[0,1,2,3,4,5,6].map(d=>`<th class="${d===tdy?'tdy':''}">${WD_GU[d]}<small>${WD_EN[d]}</small></th>`).join('')}</tr>`;
  for(let i=0;i<8;i++){
    h+=`<tr><td>${slotRange(night,i)}</td>`;
    for(let d=0;d<7;d++){const k=chSlot(night,d,i),c=CH[k];const now=nowc.night===night&&nowc.wd===d&&nowc.i===i;
      h+=`<td class="q-${c.q} ${now?'nowc':''}"><b>${st.lang==='gu'?c.gu:c.en}</b><span>${st.lang==='gu'?c.en:c.gu}</span></td>`}
    h+='</tr>';
  }
  return h+'</table></div>';
}
function vCg(){
  const nc=nowChoghadiya(),k=chSlot(nc.night,nc.wd,nc.i),c=CH[k];
  return `<div class="vtitle">${tx('cg')}<small>${tx('cgNote')}</small></div>
  <div class="card nowbox"><div><small style="color:var(--muted);font-weight:600">${tx('nowLbl')}</small><div class="big q-${c.q}" style="background:none">${c.gu} · ${c.en}</div></div>
   <div><small style="color:var(--muted)">${slotRange(nc.night,nc.i)} · ${wdName(nc.wd)}${nc.night?' ('+tx('night')+')':''}</small></div>
   <div class="sp"></div><div style="display:flex;gap:8px;flex-wrap:wrap"><span class="tag" style="background:#E4F5EC;color:#1D6A47">${tx('qgood')}: ${st.lang==='gu'?'અમૃત, શુભ, લાભ':'Amrut, Shubh, Labh'}</span><span class="tag" style="background:#FFF4D6;color:#7A5A00">${tx('qmid')}: ${st.lang==='gu'?'ચલ':'Chal'}</span><span class="tag" style="background:#FBE5E1;color:#A5331F">${tx('qbad')}: ${st.lang==='gu'?'ઉદ્વેગ, કાળ, રોગ':'Udveg, Kaal, Rog'}</span></div></div>
  <div class="cg">${cgTable(false,nc)}${cgTable(true,nc)}</div>
  <p class="note-s">UDVEG – Sorrow · CHAL – Unsteady · LABH – Gain · AMRUT – Immortal · KAL – Destructive · SHUBH – Auspicious · ROG – Malady</p>`;
}

/* ---------- Guide ---------- */
function vGuide(){
  const how=GUIDE_HOW.map(g=>`<div class="card gcard"><h3>${g[0]} ${g[1]}</h3><p>${g[2]}</p></div>`).join('');
  const fest=GUIDE_FEST.map(g=>`<li><b>${g[0]}</b>: ${g[1]}</li>`).join('');
  return `<div class="vtitle">${tx('guide')}<small>${st.lang==='gu'?'આ વિભાગ અંગ્રેજીમાં છે':'A quick guide to the Gujarati lunar calendar'}</small></div>
  <div class="sectitle" style="margin-top:0">${tx('howTitle')}</div><div class="gd">${how}</div>
  <div class="sectitle">${tx('festTitle')}</div><div class="card gcard"><ul>${fest}</ul></div>`;
}

/* ============================== DAY SHEET ============================== */
function miniCg(night,wd){
  let h=`<h4>${night?'🌙 ':'☀️ '}${tx(night?'night':'day')}</h4>`;
  for(let i=0;i<8;i++){const c=CH[chSlot(night,wd,i)];h+=`<div class="q-${c.q}"><b>${st.lang==='gu'?c.gu:c.en}</b><span>${st.lang==='gu'?c.en:c.gu}</span><small>${slotRange(night,i)}</small></div>`}
  return h;
}
function openDay(key){
  const r=BYKEY[key];if(!r)return;st.sel=key;const e=r.e,it=dayItems(r),mo=moonInfo(r);
  const idx=DAYS.indexOf(r);
  let kv='';
  if(e.t){
    const gm=r.gm?L(GM[r.gm]):'';
    kv+=`<div>${tx('tithi')}</div><div><span class="bigt">${tn(e.t)}</span> <span class="g">${gm} ${r.paksha==='S'?tx('sud'):tx('vad')}</span></div>`;
  }
  if(it.length)kv+=`<div>${tx('events')}</div><div>${it.map(x=>`<div class="ev-item"><span class="ic">${x.ic||'•'}</span><span>${esc(L(x))}</span></div>`).join('')}</div>`;
  if(e.pk){const p=e.pk,txt=p[0]==='s'?`${tx('pks')} ${p.slice(1)}`:p[0]==='e'?`${tx('pke')} ${p.slice(1)}`:tx('pkRun');kv+=`<div>${tx('panchak')}</div><div class="g">🕉️ ${txt}</div>`}
  if(mo.cur||mo.ch.length){
    const R=mo.cur?RASI[mo.cur.k]:null;let t='';
    if(R)t+=`${R.z} ${st.lang==='gu'?R.gu:R.en+' ('+R.w+')'}`;
    mo.ch.forEach(c=>{const X=RASI[c.k];t+=`<div class="hint" style="margin-top:3px">→ ${X.z} ${st.lang==='gu'?X.gu:X.en} ${tx('enters')} ${c.time}</div>`});
    kv+=`<div>${tx('moonsign')}</div><div class="g">${t}</div>`;
  }
  const ttl=`${wdName(r.wd)}, ${r.d} ${monName(r.m-1)} ${r.y}`;
  $('#sheet').innerHTML=`<div class="sh-top"><div class="sh-d">${r.d}</div><div class="sh-t"><b>${ttl}</b><span>${esc(L(MONTHS[r.mi].head))}</span></div>
    <div class="sh-nav"><button data-a="dprev" ${idx===0?'disabled':''}>‹</button><button data-a="dnext" ${idx===DAYS.length-1?'disabled':''}>›</button><button data-a="close">✕</button></div></div>
    <div class="sh-b">${kv?`<div class="kv">${kv}</div>`:''}
      <div class="mini-cg">${miniCg(false,r.wd)}${miniCg(true,r.wd)}</div>
      <div><b style="font-size:13px">📝 ${tx('notes')}</b> <span class="hint">· ${tx('notesHint')}</span>
      <textarea class="nt" id="nt" placeholder="${esc(tx('notesPh'))}" style="margin-top:8px"></textarea></div></div>`;
  const nt=$('#nt');nt.value=NOTES[key]||'';
  nt.addEventListener('input',()=>{if(nt.value.trim())NOTES[key]=nt.value;else delete NOTES[key];save('gujarati-calendar-sa-notes-v1',NOTES)});
  $('#modal').classList.add('open');$('#sheet').scrollTop=0;
}
function closeDay(){$('#modal').classList.remove('open');st.sel=null;if(st.view==='month'||st.view==='year'||st.view==='fest'){const q=$('#q');const fo=q&&document.activeElement===q;render()}}

/* ============================== EVENTS ============================== */
function monthIdxForToday(){
  const tk=todayKey(),r=BYKEY[tk];if(r)return r.mi;
  const first=DAYS[0].key;return tk<first?0:MONTHS.length-1;
}
document.addEventListener('click',ev=>{
  if(ev.target.id==='modal'){closeDay();return}
  const l=ev.target.closest('#langSeg button');if(l){st.lang=l.dataset.l;persist();render();if(st.sel)openDay(st.sel);return}
  if(ev.target.closest('#themeBtn')){st.theme=st.theme==='dark'?'light':'dark';persist();render();return}
  const a=ev.target.closest('[data-a]');if(!a)return;const act=a.dataset.a;
  if(act==='view'){st.view=a.dataset.v;persist();render();window.scrollTo({top:0,behavior:'smooth'})}
  else if(act==='prev'){if(st.mi>0){st.mi--;render()}}
  else if(act==='next'){if(st.mi<MONTHS.length-1){st.mi++;render()}}
  else if(act==='today'){st.mi=monthIdxForToday();render();const t=document.querySelector('.cell.today');if(t)t.scrollIntoView({block:'center',behavior:'smooth'})}
  else if(act==='layout'){st.layout=st.layout==='grid'?'list':'grid';persist();render()}
  else if(act==='print'){window.print()}
  else if(act==='day'){openDay(a.dataset.k)}
  else if(act==='openm'){st.mi=+a.dataset.i;st.view='month';persist();render();window.scrollTo({top:0,behavior:'smooth'})}
  else if(act==='filter'){st.filter=a.dataset.f;render()}
  else if(act==='close'){closeDay()}
  else if(act==='dprev'||act==='dnext'){const i=DAYS.findIndex(d=>d.key===st.sel)+(act==='dnext'?1:-1);if(DAYS[i])openDay(DAYS[i].key)}
});
document.addEventListener('change',ev=>{if(ev.target.id==='mSel'){st.mi=+ev.target.value;render()}});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&st.sel){closeDay();return}
  if(ev.target.matches('input,textarea,select'))return;
  if(st.sel){if(ev.key==='ArrowLeft'){const i=DAYS.findIndex(d=>d.key===st.sel)-1;if(DAYS[i])openDay(DAYS[i].key)}if(ev.key==='ArrowRight'){const i=DAYS.findIndex(d=>d.key===st.sel)+1;if(DAYS[i])openDay(DAYS[i].key)}return}
  if(st.view==='month'){if(ev.key==='ArrowLeft'&&st.mi>0){st.mi--;render()}if(ev.key==='ArrowRight'&&st.mi<MONTHS.length-1){st.mi++;render()}}
});
st.mi=monthIdxForToday();
render();
</script>
</body>
</html>
